# This file is included inside nginx's http context by the official image.
# The upstream stays inside the Compose network; only the proxy publishes a
# host port. deploy.sh tests the same config on a loopback-only candidate port.

map $upstream_http_vary $forge_vary {
    default "$upstream_http_vary, Accept-Encoding";
    ""      "Accept-Encoding";
    "*"     "*";
    "~*(^|,\\s*)accept-encoding(\\s*,|$)" $upstream_http_vary;
}

map $http_upgrade $forge_connection_upgrade {
    default upgrade;
    ""      "";
}

map $http_authorization $forge_has_authorization {
    default 1;
    ""      0;
}

map $http_cookie $forge_has_cookie {
    default 1;
    ""      0;
}

# Keep upstream cache directives for ordinary responses. HTML must revalidate,
# authenticated reads stay private, and writes/auth endpoints are never stored.
map "$request_method|$request_uri|$forge_has_authorization|$forge_has_cookie|$upstream_http_set_cookie|$upstream_http_content_type" $forge_response_cache_control {
    default $upstream_http_cache_control;
    "~*^(?:POST|PUT|PATCH|DELETE|OPTIONS)\\|" "no-store";
    "~*^[^|]+\\|/(?:api/v[0-9]+/)?(?:auth|session)(?:/|\\?|$)" "no-store";
    "~*^[^|]+\\|[^|]*\\|[^|]*\\|[^|]*\\|[^|]+\\|" "no-store";
    "~*^[^|]+\\|[^|]*\\|1\\|" "private, no-cache";
    "~*^[^|]+\\|[^|]*\\|[^|]*\\|1\\|" "private, no-cache";
    "~*^[^|]+\\|[^|]*\\|[^|]*\\|[^|]*\\|[^|]*\\|text/html(?:;|$)" "private, no-cache";
}

# Only successful, unauthenticated responses with a static-resource MIME type
# can be immutable. HTML fallbacks, errors, credentials and Set-Cookie responses
# use a private/no-store policy even when their URL happens to contain a hash.
map "$status|$upstream_http_content_type|$http_authorization|$http_cookie|$upstream_http_set_cookie" $forge_asset_cache_control {
    default $upstream_http_cache_control;
    "~*^200\\|text/html(?:;|$)" "private, no-cache";
    "~*^200\\|(?:text/(?:css|javascript)|application/(?:javascript|x-javascript|ecmascript|font-woff2?|x-font-ttf|vnd\\.ms-fontobject)|font/(?:woff2?|ttf|otf))(?:;[^|]*)?\\|\\|\\|$" "public, max-age=31536000, immutable";
    "~^304\\|" $upstream_http_cache_control;
    "~^200\\|" "no-store";
    "~^[1-5][0-9]{2}\\|" "no-store";
}

# Stream requests include MCP's event-stream negotiation and conventional SSE
# endpoints. They are internally routed to a dedicated unbuffered location.
map "$http_accept|$request_uri" $forge_stream_request {
    default 0;
    "~*(?:text/event-stream|/mcp(?:/|\\?|$)|/(?:sse|stream)(?:/|\\?|$)|/events/(?:stream|subscribe)(?:/|\\?|$))" 1;
}

upstream forge_app {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Leave upload sizing to the application, as it was before the proxy.
    client_max_body_size 0;

    gzip on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_http_version 1.1;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/manifest+json
        application/ld+json
        application/problem+json
        application/rss+xml
        application/vnd.api+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/javascript
        text/xml;
    # Vary is merged below so existing Origin/Language dimensions are retained.
    gzip_vary off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $forge_connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Vary;

    location = /_forge_transport_health {
        access_log off;
        default_type text/plain;
        return 204;
    }

    # Require a content-hash-shaped filename and a real successful JS/CSS/font
    # response before assigning a one-year browser cache lifetime.
    location ~* "^/.+[.-][A-Za-z0-9_-]{8,}\.(?:m?js|css|woff2?|ttf|otf)$" {
        proxy_pass http://forge_app;
        add_header Vary $forge_vary always;
        add_header Cache-Control $forge_asset_cache_control always;
    }

    location / {
        if ($forge_stream_request) {
            rewrite ^ /_forge_stream last;
        }

        proxy_pass http://forge_app;
        add_header Vary $forge_vary always;
        add_header Cache-Control $forge_response_cache_control always;
    }

    location = /_forge_stream {
        internal;
        gzip off;
        proxy_pass http://forge_app$request_uri;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header Vary $forge_vary always;
        add_header Cache-Control $forge_response_cache_control always;
    }
}
