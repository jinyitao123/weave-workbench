# Git-based single-host production stack: this app + Postgres.
#
# Create a .env file next to this compose file (never committed) with
# POSTGRES_PASSWORD / OS_AUTH_SECRET / OS_SECRET_KEY (generate secrets with
# `openssl rand -hex 32`), then `docker compose up -d`.
#
# Docs: https://objectstack.ai/docs/deployment/self-hosting

name: inoforge

services:
  app:
    image: ${FORGE_IMAGE:-inoforge-app:local}
    build: .
    ports:
      - "${FORGE_HTTP_PORT:-8080}:8080"
    environment:
      OS_DATABASE_URL: postgres://objectstack:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myapp}
      OS_AUTH_SECRET: ${OS_AUTH_SECRET}
      OS_SECRET_KEY: ${OS_SECRET_KEY}
      OS_BASE_URL: ${OS_BASE_URL:-http://localhost:8080}
      OS_TRUSTED_ORIGINS: ${OS_TRUSTED_ORIGINS:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:'+(process.env.OS_PORT||8080)+'/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: ${POSTGRES_IMAGE:-postgres:17}
    environment:
      POSTGRES_USER: objectstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-myapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U objectstack -d ${POSTGRES_DB:-myapp}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
