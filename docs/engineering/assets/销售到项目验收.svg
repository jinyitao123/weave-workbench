<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="335" viewBox="0 0 1120 335" role="img" aria-labelledby="t d"><title id="t">从销售到项目启动的真人验收路径</title><desc id="d">分岗办理线索、报价、合同、订单和项目，最后独立读回。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#8191a6"/></marker></defs><rect width="1120" height="335" rx="24" fill="#f5f7fb"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif"><text x="38" y="51" font-size="24" font-weight="700" fill="#17233a">按真实岗位推进，到项目负责人启动为止</text><text x="38" y="79" font-size="14" fill="#526178">流程示意；每一步均需真实桌面办理和 Forge 独立读回。</text><rect x="38" y="107" width="190" height="112" rx="14" fill="white" stroke="#cbd5e1"/><text x="53" y="137" font-size="14" fill="#6a5ba8">01 · 销售小王</text><text x="53" y="177" font-size="18" font-weight="700" fill="#1d2f49">线索 → 商机</text><path d="M232,162 L251,162" stroke="#8191a6" stroke-width="2" marker-end="url(#a)"/><rect x="254" y="107" width="190" height="112" rx="14" fill="white" stroke="#cbd5e1"/><text x="269" y="137" font-size="14" fill="#6a5ba8">02 · 销售／报价复核</text><text x="269" y="177" font-size="18" font-weight="700" fill="#1d2f49">报价核算与调整</text><path d="M448,162 L467,162" stroke="#8191a6" stroke-width="2" marker-end="url(#a)"/><rect x="470" y="107" width="190" height="112" rx="14" fill="white" stroke="#cbd5e1"/><text x="485" y="137" font-size="14" fill="#6a5ba8">03 · 销售／交付／商务</text><text x="485" y="177" font-size="18" font-weight="700" fill="#1d2f49">合同复核与归档</text><path d="M664,162 L683,162" stroke="#8191a6" stroke-width="2" marker-end="url(#a)"/><rect x="686" y="107" width="190" height="112" rx="14" fill="white" stroke="#cbd5e1"/><text x="701" y="137" font-size="14" fill="#6a5ba8">04 · 订单经办／复核</text><text x="701" y="177" font-size="18" font-weight="700" fill="#1d2f49">销售订单批准</text><path d="M880,162 L899,162" stroke="#8191a6" stroke-width="2" marker-end="url(#a)"/><rect x="902" y="107" width="190" height="112" rx="14" fill="white" stroke="#cbd5e1"/><text x="917" y="137" font-size="14" fill="#6a5ba8">05 · 销售／项目经理</text><text x="917" y="177" font-size="18" font-weight="700" fill="#1d2f49">准确立项并启动</text><rect x="38" y="249" width="1044" height="48" rx="10" fill="#e7edf8"/><text x="57" y="279" font-size="15" fill="#3c526f">使用仿真材料与测试到账；不自审、不管理员代办；采购、出库、交付验收和后续财务不属于本轮。</text></g></svg>