<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">服务端与员工桌面的安装结构</title><desc id="desc">管理员在Linux部署Forge、Weave及数据库，向员工提供桌面安装包和不含密钥的组织连接文件。模型密钥仅由管理员私有配置。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#64748b"/></marker></defs>
<rect width="1120" height="620" rx="24" fill="#f5f7fb"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif"><text x="48" y="54" font-size="25" font-weight="700" fill="#17233a">一次部署服务，员工安装桌面即可接入</text>
<text x="48" y="83" font-size="15" fill="#526178">安装结构示意 · 实际就绪状态以检查工具和真人验收为准</text>
<rect x="46" y="119" width="628" height="425" rx="20" fill="white" stroke="#ccd5e3"/>
<rect x="46" y="119" width="628" height="59" rx="20" fill="#e6ecff"/>
<text x="70" y="157" font-size="20" font-weight="700" fill="#3345a0">管理员 · Linux 服务端</text>
<rect x="74" y="205" width="270" height="104" rx="14" fill="#e9f1ff"/>
<text x="96" y="244" font-size="22" font-weight="700" fill="#1b4f91">Forge</text><text x="96" y="273" font-size="15" fill="#345473">账号、业务、权限与正式结果</text>
<rect x="374" y="205" width="270" height="104" rx="14" fill="#eeebff"/>
<text x="396" y="244" font-size="22" font-weight="700" fill="#574092">Weave</text><text x="396" y="273" font-size="15" fill="#62517d">团队、执行、恢复与运行记录</text>
<path d="M375,260 L344,260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="74" y="341" width="270" height="72" rx="12" fill="#eef4f5"/><text x="96" y="371" font-size="17" font-weight="600" fill="#285964">Forge 数据与附件</text><text x="96" y="396" font-size="14" fill="#4d6970">独立持久卷 · 重启保留</text>
<rect x="374" y="341" width="270" height="72" rx="12" fill="#eef4f5"/><text x="396" y="371" font-size="17" font-weight="600" fill="#285964">Weave 数据与工作区</text><text x="396" y="396" font-size="14" fill="#4d6970">独立持久卷 · 重启保留</text>
<rect x="74" y="443" width="570" height="74" rx="12" fill="#fff5e4"/><text x="96" y="475" font-size="17" font-weight="600" fill="#8b5f1c">首次初始化与私有配置</text><text x="96" y="500" font-size="14" fill="#7a653f">原生首管与组织 → 模型 → 团队试跑与发布</text>
<rect x="754" y="119" width="320" height="425" rx="20" fill="white" stroke="#ccd5e3"/>
<text x="778" y="157" font-size="20" font-weight="700" fill="#17233a">员工 · 桌面端</text>
<rect x="778" y="204" width="272" height="81" rx="12" fill="#f0f3f8"/><text x="800" y="237" font-size="18" font-weight="600" fill="#28364e">① 安装桌面程序</text><text x="800" y="262" font-size="14" fill="#526178">运行匹配系统与架构的安装包</text>
<rect x="778" y="309" width="272" height="81" rx="12" fill="#f0f3f8"/><text x="800" y="342" font-size="18" font-weight="600" fill="#28364e">② 导入组织连接</text><text x="800" y="367" font-size="14" fill="#526178">文件只含地址，不含密码或密钥</text>
<rect x="778" y="414" width="272" height="81" rx="12" fill="#e9f6ef"/><text x="800" y="447" font-size="18" font-weight="600" fill="#266344">③ 本人登录与工作</text><text x="800" y="472" font-size="14" fill="#49745b">无需员工安装 Docker 或全局 CLI</text>
<path d="M675,350 L750,350" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="585" font-size="14" fill="#64748b">业务完成以 Forge 结果为准；模型目录、服务健康与团队运行状态分别核验。</text></g></svg>