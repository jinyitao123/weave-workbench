<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge 登录</title>
<style>
  :root {
    --fp-bg: #f5f7fb;
    --fp-surface: #fff;
    --fp-text: #172033;
    --fp-label: #344054;
    --fp-muted: #667085;
    --fp-subtle: #98a2b3;
    --fp-line: #e4e8f0;
    --fp-input-line: #dfe3ea;
    --fp-primary: #245bdb;
    --fp-primary-hover: #1948bb;
    --fp-ring: rgba(36, 91, 219, .16);
    --hero-from: #4051b5;
    --hero-to: #245bdb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--fp-surface);
    color: var(--fp-text);
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .shell { position: relative; display: flex; height: 100vh; min-height: 600px; }

  /* 动态背景：着色器画面 + 胶片颗粒 */
  .media { position: relative; overflow: hidden; background: #0c1426; }
  .theme-mist .media { background: #e9eef8; }
  .media canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* 视频位：有素材时淡入覆盖着色器；封面图先垫底，避免黑屏闪烁 */
  .media-video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity .8s ease;
  }
  .media-video.ready { opacity: 1; }
  .media.has-video { background-size: cover; background-position: center; }
  .media.has-video::after { display: none; }
  .media::after {
    content: ""; position: absolute; inset: -50%; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: .16; mix-blend-mode: overlay;
    animation: grain 1.2s steps(6) infinite;
  }
  .theme-mist .media::after { opacity: .22; mix-blend-mode: soft-light; }
  @keyframes grain {
    0% { transform: translate(0, 0); } 20% { transform: translate(-3%, 2%); } 40% { transform: translate(2%, -3%); }
    60% { transform: translate(-2%, -1%); } 80% { transform: translate(3%, 3%); } 100% { transform: translate(0, 0); }
  }

  .panel { display: flex; flex-direction: column; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 7px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--hero-from), var(--hero-to));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 1px 2px rgba(16,24,40,.12);
  }
  .center { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 40px 0; }
  .card { width: 100%; max-width: 360px; display: flex; flex-direction: column; animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
  .card h1 { margin: 0 0 32px; font-size: 30px; line-height: 1.25; font-weight: 600; letter-spacing: -0.025em; }
  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .field-head { display: flex; align-items: baseline; justify-content: space-between; }
  label { font-size: 13px; font-weight: 500; color: var(--fp-label); }
  a { color: var(--fp-muted); text-decoration: none; font-size: 13px; transition: color .15s ease; }
  a:hover { color: var(--fp-primary); }
  a:focus-visible { outline: 2px solid var(--fp-primary); outline-offset: 2px; border-radius: 3px; }
  input {
    height: 44px; padding: 0 14px; width: 100%;
    border: 1px solid var(--fp-input-line); border-radius: 10px;
    font: inherit; font-size: 15px; color: var(--fp-text); background: var(--fp-surface);
    box-shadow: 0 1px 2px rgba(16,24,40,.04);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder { color: var(--fp-subtle); }
  input:hover { border-color: #c9d0db; }
  input:focus { outline: none; border-color: var(--fp-primary); box-shadow: 0 0 0 4px var(--fp-ring); }
  .primary {
    margin-top: 10px; height: 44px; border: 0; border-radius: 10px;
    background: var(--fp-primary); color: #fff;
    font: inherit; font-size: 15px; font-weight: 600; letter-spacing: .02em; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 1px 2px rgba(16,24,40,.14);
    transition: background-color .15s ease, transform .1s ease;
  }
  .primary:hover { background: var(--fp-primary-hover); }
  .primary:active { transform: translateY(1px); }
  .primary:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--fp-ring); }
  .ctrl {
    position: absolute; z-index: 2; width: 32px; height: 32px; padding: 0;
    border-radius: 16px; border: 0; cursor: pointer;
    background: rgba(255,255,255,.10); color: rgba(255,255,255,.85);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    display: inline-flex; align-items: center; justify-content: center;
    transition: background-color .15s ease;
  }
  .theme-mist .ctrl { background: rgba(23,32,51,.06); color: #475467; }
  .ctrl:hover { background: rgba(255,255,255,.2); }
  .theme-mist .ctrl:hover { background: rgba(23,32,51,.12); }
  .ctrl:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .ctrl .i-play { display: none; }
  .ctrl[aria-pressed="true"] .i-play { display: block; }
  .ctrl[aria-pressed="true"] .i-pause { display: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* 方向 A：左表单，右动态面板 */
  .layout-a .panel { order: 0; flex: 0 1 600px; padding: 32px 48px; }
  .layout-a .media { order: 1; flex: 1 1 0; margin: 14px 14px 14px 0; border-radius: 20px; }
  .layout-a .ctrl { right: 32px; bottom: 32px; }

  /* 方向 B：全屏动态背景，卡片居中 */
  .layout-b .media { position: absolute; inset: 0; }
  .layout-b .panel { position: relative; z-index: 1; flex: 1 1 auto; padding: 28px 32px; }
  .layout-b.theme-ink .brand { color: #fff; }
  .layout-b .card {
    max-width: 400px; padding: 40px 40px 36px; color: var(--fp-text);
    background: var(--fp-surface); border-radius: 16px;
    box-shadow: 0 0 0 1px rgba(16,24,40,.04), 0 2px 4px rgba(16,24,40,.04), 0 32px 80px -24px rgba(8,15,35,.45);
  }
  .layout-b .card h1 { font-size: 26px; margin-bottom: 28px; }
  .layout-b .ctrl { right: 24px; bottom: 24px; }

  @media (max-width: 900px) {
    .layout-a .media, .layout-a .ctrl { display: none; }
    .layout-a .panel { flex: 1 1 auto; padding: 24px 16px; }
    .layout-b .panel { padding: 20px 16px; }
    .layout-b .card { padding: 32px 24px 28px; }
  }
  @media (prefers-reduced-motion: reduce) { .card, .media::after { animation: none; } }

  /* 仅原型：方向与色调切换 */
  .proto { position: fixed; z-index: 10; top: 16px; right: 16px; display: flex; gap: 8px; }
  .proto [role="group"] { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: rgba(23,32,51,.82); }
  .proto button { height: 26px; padding: 0 10px; border: 0; border-radius: 6px; cursor: pointer; background: transparent; color: #c7cfdd; font: inherit; font-size: 12px; }
  .proto button[aria-pressed="true"] { background: #fff; color: var(--fp-text); font-weight: 600; }
  .proto button:focus-visible { outline: 2px solid #8fb0ff; outline-offset: 1px; }
</style>
</head>
<body class="layout-a theme-mist">
<div class="shell">
  <section class="media" id="media" aria-hidden="true">
    <canvas id="flow"></canvas>
    <video class="media-video" id="media-video" muted loop playsinline preload="auto"></video>
  </section>
  <main class="panel">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="#fff" d="M4.5 2.75h7.25v2.4H7.1v1.9h3.9v2.3H7.1v3.9H4.5z"/></svg>
      </span>
      <span>Forge</span>
    </div>
    <div class="center">
      <form class="card" id="login" novalidate>
        <h1>登录</h1>
        <div class="field">
          <label for="account">账号</label>
          <input id="account" type="text" autocomplete="username" placeholder="账号或邮箱">
        </div>
        <div class="field">
          <div class="field-head">
            <label for="password">密码</label>
            <a href="#">忘记密码</a>
          </div>
          <input id="password" type="password" autocomplete="current-password">
        </div>
        <button class="primary" type="submit">登录</button>
      </form>
    </div>
  </main>
  <button class="ctrl" id="toggle" type="button" aria-pressed="false" aria-label="暂停背景动画" title="暂停背景动画">
    <svg class="i-pause" viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true"><rect x="4" y="3" width="2.6" height="10" rx="1"/><rect x="9.4" y="3" width="2.6" height="10" rx="1"/></svg>
    <svg class="i-play" viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M5 3.2v9.6a.5.5 0 0 0 .77.42l7.4-4.8a.5.5 0 0 0 0-.84l-7.4-4.8A.5.5 0 0 0 5 3.2Z"/></svg>
  </button>
</div>

<div class="proto">
  <div role="group" aria-label="原型方向">
    <button type="button" data-layout="a">A 分栏</button>
    <button type="button" data-layout="b">B 全屏</button>
  </div>
  <div role="group" aria-label="原型色调">
    <button type="button" data-theme="ink">墨蓝</button>
    <button type="button" data-theme="mist">雾白</button>
  </div>
</div>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform vec3 uC0, uC1, uC2, uC3, uC4;

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 4; i++) { v += a * noise(p); p = m * p; a *= 0.5; }
  return v;
}
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = uv * vec2(uRes.x / uRes.y, 1.0) * 0.72;
  float t = uTime * 0.035;
  vec2 q = vec2(fbm(p + vec2(0.0, t)), fbm(p + vec2(5.2, 1.3) - t));
  vec2 r = vec2(fbm(p + 3.2 * q + vec2(1.7, 9.2) + t * 0.6), fbm(p + 3.2 * q + vec2(8.3, 2.8) - t * 0.4));
  float f = fbm(p + 2.6 * r);

  vec3 col = mix(uC0, uC1, smoothstep(0.25, 0.85, f));
  col = mix(col, uC2, smoothstep(0.55, 1.05, length(q)) * 0.7);
  col = mix(col, uC3, smoothstep(0.5, 0.9, r.y) * 0.45);
  col = mix(col, uC4, pow(smoothstep(0.6, 1.0, f * f * 1.6), 2.0) * 0.35);

  float vig = smoothstep(1.25, 0.25, length(uv - vec2(0.55, 0.5)));
  col = mix(uC0, col, mix(0.55, 1.0, vig));
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(function () {
  var THEMES = {
    // 墨蓝：深墨底 + Forge 标识区的靛蓝、主蓝和深海蓝，降低饱和
    ink:  ['#070b16', '#111c3a', '#2c4fb6', '#1b5663', '#9fb5f2'],
    // 雾白：与 Forge 浅灰蓝页面底同调的雾面色
    mist: ['#e7edf8', '#cdd9f3', '#8fa9ee', '#b3d6dc', '#ffffff']
  };
  var canvas = document.getElementById('flow');
  var toggle = document.getElementById('toggle');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var gl = canvas.getContext('webgl', { antialias: false, premultipliedAlpha: false });
  var t = 20, paused = false, last = performance.now(), theme = 'ink';
  var uniforms = {};

  function hex(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16) / 255; }); }

  if (gl) {
    var vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}');
    gl.compileShader(vs);
    var fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, document.getElementById('frag').textContent);
    gl.compileShader(fs);
    var prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error(gl.getShaderInfoLog(fs));
      gl = null;
    } else {
      gl.useProgram(prog);
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(prog, 'a');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      ['uRes', 'uTime', 'uC0', 'uC1', 'uC2', 'uC3', 'uC4'].forEach(function (n) { uniforms[n] = gl.getUniformLocation(prog, n); });
    }
  }

  function applyTheme() {
    if (!gl) return;
    THEMES[theme].forEach(function (c, i) { gl.uniform3fv(uniforms['uC' + i], hex(c)); });
    draw();
  }

  // 柔和色域不需要满分辨率：按半分辨率渲染，省电且更顺滑
  function fit() {
    if (!gl) return;
    var r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width * 0.5));
    canvas.height = Math.max(1, Math.round(r.height * 0.5));
    gl.viewport(0, 0, canvas.width, canvas.height);
    draw();
  }

  function draw() {
    if (!gl) return;
    gl.uniform2f(uniforms.uRes, canvas.width, canvas.height);
    gl.uniform1f(uniforms.uTime, t);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function tick(now) {
    var dt = Math.min(now - last, 50) / 1000;
    last = now;
    if (!paused && !reduce && !document.hidden && !videoReady) { t += dt; draw(); }
    requestAnimationFrame(tick);
  }

  // 视频位：?video=素材.webm&poster=封面.jpg。没有素材时继续用着色器。
  var media = document.getElementById('media');
  var video = document.getElementById('media-video');
  var params = new URLSearchParams(location.search);
  var videoSrc = params.get('video');
  var posterSrc = params.get('poster');
  var videoReady = false;
  if (videoSrc) {
    media.classList.add('has-video');
    if (posterSrc) {
      video.poster = posterSrc;
      media.style.backgroundImage = 'url("' + posterSrc.replace(/"/g, '%22') + '")';
    }
    video.src = videoSrc;
    video.addEventListener('canplay', function () {
      videoReady = true;
      video.classList.add('ready');
      if (!reduce && !paused) video.play().catch(function () {});
    }, { once: true });
    // 减少动态效果时只显示封面，不播放
    if (reduce && posterSrc) video.classList.add('ready');
    document.addEventListener('visibilitychange', function () {
      if (!videoReady) return;
      if (document.hidden) video.pause();
      else if (!paused && !reduce) video.play().catch(function () {});
    });
  }

  if (gl) {
    new ResizeObserver(fit).observe(canvas);
    applyTheme();
    fit();
    requestAnimationFrame(tick);
  }

  toggle.addEventListener('click', function () {
    paused = !paused;
    var label = paused ? '播放背景动画' : '暂停背景动画';
    if (videoReady) { if (paused) video.pause(); else if (!reduce) video.play().catch(function () {}); }
    toggle.setAttribute('aria-pressed', String(paused));
    toggle.setAttribute('aria-label', label);
    toggle.title = label;
  });

  document.getElementById('login').addEventListener('submit', function (e) { e.preventDefault(); });

  // 仅原型：方向与色调切换，记在地址 #a-ink 等
  var state = (location.hash.slice(1) || 'a-mist').split('-');
  var layout = state[0] === 'b' ? 'b' : 'a';
  theme = state[1] === 'ink' ? 'ink' : 'mist';
  function sync() {
    document.body.className = 'layout-' + layout + ' theme-' + theme;
    document.querySelectorAll('[data-layout]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.layout === layout)); });
    document.querySelectorAll('[data-theme]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.theme === theme)); });
    history.replaceState(null, '', '#' + layout + '-' + theme);
    applyTheme();
  }
  document.querySelectorAll('[data-layout]').forEach(function (b) { b.addEventListener('click', function () { layout = b.dataset.layout; sync(); }); });
  document.querySelectorAll('[data-theme]').forEach(function (b) { b.addEventListener('click', function () { theme = b.dataset.theme; sync(); }); });
  sync();
})();
</script>
</body>
</html>
