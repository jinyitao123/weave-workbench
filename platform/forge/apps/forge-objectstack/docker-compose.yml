# Git-based single-host production stack: this app + Postgres.
#
# Create a .env file next to this compose file (never committed) with
# POSTGRES_PASSWORD / OS_AUTH_SECRET / OS_SECRET_KEY (generate secrets with
# `openssl rand -hex 32`), then `docker compose up -d`.
#
# Docs: https://objectstack.ai/docs/deployment/self-hosting

name: inoforge

x-forge-proxy: &forge-proxy
  image: ${FORGE_PROXY_IMAGE:-inoforge-proxy:local}
  build:
    context: .
    dockerfile: Dockerfile
    target: proxy
    additional_contexts:
      console94: ${FORGE_CONSOLE_BUILD_CONTEXT:-.generated/console94}
    args:
      FORGE_SOURCE_REVISION: ${FORGE_SOURCE_REVISION:-unknown}
  depends_on:
    app:
      condition: service_healthy
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/_forge_transport_health || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 5s

services:
  app:
    image: ${FORGE_IMAGE:-inoforge-app:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      additional_contexts:
        console94: ${FORGE_CONSOLE_BUILD_CONTEXT:-.generated/console94}
      args:
        CONSOLE_SOURCE_REVISION: ${FORGE_CONSOLE_SOURCE_REVISION:-unknown}
        CONSOLE_TREE_SHA256: ${FORGE_CONSOLE_TREE_SHA256:-unknown}
    expose:
      - "8080"
    volumes:
      - uploads:/srv/app/.objectstack/data/uploads
    environment:
      OS_DATABASE_URL: postgres://objectstack:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myapp}
      OS_AUTH_SECRET: ${OS_AUTH_SECRET}
      OS_SECRET_KEY: ${OS_SECRET_KEY}
      FORGE_WEAVE_EVENT_SECRET: ${FORGE_WEAVE_EVENT_SECRET:-}
      OS_BASE_URL: ${OS_BASE_URL:-http://localhost:8080}
      OS_TRUSTED_ORIGINS: ${OS_TRUSTED_ORIGINS:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:'+(process.env.OS_PORT||8080)+'/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  proxy:
    <<: *forge-proxy
    ports:
      - "${FORGE_HTTP_BIND:-0.0.0.0}:${FORGE_HTTP_PORT:-8080}:80"

  proxy-candidate:
    <<: *forge-proxy
    profiles:
      - transport-candidate
    ports:
      - "127.0.0.1:${FORGE_CANDIDATE_PORT:-14612}:80"

  db:
    image: ${POSTGRES_IMAGE:-postgres:17}
    environment:
      POSTGRES_USER: objectstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-myapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U objectstack -d ${POSTGRES_DB:-myapp}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
