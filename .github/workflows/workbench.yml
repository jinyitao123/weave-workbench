name: Workbench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Verify native isolation launcher
        working-directory: native/landlock-run
        run: |
          pnpm build:ts
          pnpm build:native
          node ./test/entry.test.js
      - name: Verify independent Workbench
        run: pnpm run check:workbench
