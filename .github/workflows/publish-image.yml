name: Publish Workbench image

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-workbench-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools bubblewrap
      - name: Verify native isolation launcher
        working-directory: native/landlock-run
        run: |
          pnpm build:ts
          pnpm build:native
          node ./test/entry.test.js
          ./packages/linux-x64/bin/landlock-run --probe | grep -Fx 'landlock: fully enforced'
      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify release source
        env:
          DSH_GATE_CONCURRENCY: '1'
        run: pnpm run check:all

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be v<semver>; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ github.sha }}
            DSH_CLIENT_VERSION=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/weave-workbench:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/weave-workbench:${{ steps.release.outputs.version }}
      - name: Record published digest
        run: echo "Published ${{ github.ref_name }} at ${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
